# config/behavior.toml — поведение Микрочела (PHASE 3, FR-P3.3)
# Все длительности — миллисекунды. Отсутствующие ключи → дефолт из
# src/microchel/character/config.py. Битые значения игнорируются с предупреждением.

# Пауза между действиями (пока персонаж простоит в idle)
[idle]
min_ms = 15000
max_ms = 60000

# Ходьба (движение окна)
[walk]
min_ms = 5000
max_ms = 15000
step_px = 3        # пиксели за шаг
interval_ms = 60   # период шага (~50 px/с)

# Сидение
[sit]
min_ms = 60000
max_ms = 180000

# Кофе
[coffee]
min_ms = 30000
max_ms = 60000

# Задумчивость
[thinking]
min_ms = 20000
max_ms = 45000

# Сон (ночью просыпается редко)
[sleep]
min_ms = 300000   # 5 мин
max_ms = 900000   # 15 мин

# Веса автономного выбора из idle (0 — исключить состояние; сумма не нормируется)
[weights]
walk = 40
sit = 20
coffee = 15
thinking = 15
sleep = 10

# Ночь: к весу sleep прибавляется sleep_weight — ночью сон доминирует (~78%)
[night]
from = 23
to = 8
sleep_weight = 300

# Анимация реакции на клик/системное событие (префикс имени клипа)
# ВНИМАНИЕ: у текущей внешности (malinka, встроена 2026-10-10) клипа Blink нет —
# реакция заработает, когда вернутся состояния/клипы эмоций (пересмотреть)
[reaction]
clip = "Blink"
